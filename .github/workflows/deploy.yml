name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch YouTube stats, titles and thumbnails
        run: node scripts/update-stats.mjs
      - name: Collect the public files
        run: |
          mkdir _site
          for f in index.html 404.html stats.json CNAME music.mp3 robots.txt; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          cp -r img fonts thumbs _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
